name: Defect
description: Report something broken in the portal, the shapes, the schema or the examples
title: "[Defect] "
labels: ["defect"]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: Page address or file name
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal data or anything sensitive
          required: true
