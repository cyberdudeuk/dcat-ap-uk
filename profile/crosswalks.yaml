# Crosswalks from DCAT-AP-UK to other metadata models. Each row: [DCAT-AP-UK property, their element, note].
# A property may be a base property or an extension property; the loader refuses a row naming neither.
# "(class)" stands for the record's class. Provenance V (D-045): every element named was found in that standard's own published
# definition, at the address in `checked_at`, on the date in `checked`. Whether each pairing is the best one is still the
# author's judgement, to be agreed with each community (open register O-04). K: names not yet checked.
# Crosswalks to DCAT-AP and DCAT-US are computed from the RDF terms themselves, so they are not listed here.

ckan:
  label: CKAN with ckanext-dcat
  their: CKAN dataset and resource fields
  source: ckandcat
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://github.com/ckan/ckanext-dcat/blob/c3e9c81bda4d491694aa08969ec911f37b4c4dd5/ckanext/dcat/profiles/euro_dcat_ap_base.py and https://github.com/ckan/ckanext-dcat/blob/c3e9c81bda4d491694aa08969ec911f37b4c4dd5/ckanext/dcat/profiles/base.py'
  note: Field names as the ckanext-dcat European profile reads and writes them. Fields marked extras are stored as CKAN extras or scheming fields.
  rows:
    - [title, title, '']
    - [description, notes, '']
    - [keyword, tags, '']
    - [identifier, extras identifier, '']
    - [publisher, organization and extras publisher_uri, '']
    - [contactPoint, extras contact_name and contact_uri, 'Use a contact form address for contact_uri, not an email address.']
    - [licence, license_id, 'Map OGL v3.0 to the CKAN licence id your instance uses.']
    - [issued, extras issued, '']
    - [modified, extras modified, '']
    - [landingPage, url, '']
    - [version, version, '']
    - [theme, extras theme, '']
    - [spatial, extras spatial_uri, '']
    - [temporal, extras temporal_start and temporal_end, '']
    - [language, extras language, '']
    - [accrualPeriodicity, extras frequency, '']
    - [conformsTo, extras conforms_to, '']
    - [accessRights, extras access_rights, '']
    - [distribution, resources, 'One CKAN resource per distribution.']
    - [accessURL, resource access_url, '']
    - [downloadURL, resource download_url, '']
    - [mediaType, resource mimetype, '']
    - [format, resource format, '']
    - [byteSize, resource size, '']
    - [checksum, resource hash and hash_algorithm, '']
    - [securityClassification, (none), 'Add a scheming field; harvesters that do not know it will drop it.']
    - [criticalDataAsset, (none), 'Add a scheming field.']

dublin-core:
  label: Dublin Core (15 elements)
  their: Dublin Core Metadata Element Set 1.1
  source: dcmes
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://www.dublincore.org/specifications/dublin-core/dces/'
  note: Required by Ofgem Data Best Practice for energy system data. Every element has a DCAT-AP-UK property, so a DCAT-AP-UK record is also a Dublin Core description.
  rows:
    - [title, Title, '']
    - [creator, Creator, '']
    - [keyword, Subject, 'Also theme, for a controlled subject.']
    - [description, Description, '']
    - [publisher, Publisher, '']
    - [qualifiedAttribution, Contributor, 'With the role played.']
    - [issued, Date, 'Also created and modified.']
    - [(class), Type, 'The record''s class; for a service also service type.']
    - [mediaType, Format, 'On the distribution; also format.']
    - [identifier, Identifier, '']
    - [relation, Source, 'Use relation with a qualified relationship of role source.']
    - [language, Language, '']
    - [relation, Relation, '']
    - [spatial, Coverage, 'And temporal, for coverage in time.']
    - [rights, Rights, 'And licence and access rights.']

gemini:
  label: UK GEMINI 2.3
  their: UK GEMINI elements
  source: gemini
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://github.com/agiorguk/gemini/blob/95eafa428b2d7d1b6d8da12f8366948dd399653e/docs/1250-element-summary.asciidoc'
  note: UK GEMINI is encoded in ISO 19139 XML. Properties from the geospatial extension are marked. A first step towards closing open register O-11, which needs the geospatial community.
  rows:
    - [title, Title, '']
    - [alternative, Alternative title, '']
    - [language, Dataset language, '']
    - [description, Abstract, 'Use abstract for a short summary as well.']
    - [topicCategory, Topic category, 'Geospatial extension.']
    - [keyword, Keyword, '']
    - [temporal, Temporal extent, '']
    - [issued, Dataset reference date, 'Publication date; also created and modified for the other date types.']
    - [lineage, Lineage, 'Geospatial extension.']
    - [spatial, Extent, 'A named area; use a GSS code where there is one.']
    - [bbox, Bounding box, 'On the location.']
    - [conformsTo, Spatial reference system, 'Give the coordinate reference system address. Mandatory in the geospatial extension.']
    - [spatialResolutionInMeters, Spatial resolution, '']
    - [accessURL, Resource locator, 'And download address.']
    - [mediaType, Data format, 'And format.']
    - [publisher, Responsible organisation, 'With contact point and responsible role for the other roles.']
    - [accrualPeriodicity, Maintenance information, 'Element 53, maintenance frequency.']
    - [accessRights, Limitations on public access, 'With the rights statement.']
    - [licence, Use constraints, '']
    - [conformsTo, Conformity, '']
    - [identifier, Resource identifier, 'Element 36.']
    - [inSeries, Parent identifier, '']
    - [serviceType, Spatial data service type, '']
    - [servesDataset, Coupled resource, '']
    - [qualityAnnotation, Data quality, '']
    - [(class), Resource type, '']

hdruk:
  label: HDR UK Gateway schema 4.1.0
  their: HDR UK dataset schema fields
  source: hdruk
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://github.com/HDRUK/schemata/blob/2066343fd63132531d3656c716a1f46b0b03c2a0/hdr_schemata/models/HDRUK/4.1.0/schema.json'
  note: Field paths as in the HDR UK schemata. Properties from the health extension are marked. The HDR UK schema allows an email contact; DCAT-AP-UK prefers a contact form.
  rows:
    - [title, summary.title, '']
    - [abstract, summary.abstract, '']
    - [description, documentation.description, '']
    - [keyword, summary.keywords, '']
    - [publisher, summary.dataCustodian, 'Called summary.publisher before version 4.']
    - [contactPoint, summary.contactPoint, 'Give a contact form address.']
    - [otherIdentifier, summary.doiName, '']
    - [identifier, identifier, '']
    - [version, version, '']
    - [issued, issued, '']
    - [modified, modified, '']
    - [rights, accessibility.access.accessRights, '']
    - [jurisdiction, accessibility.access.jurisdiction, '']
    - [hasPolicy, accessibility.usage.dataUseLimitation, 'Express the limitation as an ODRL policy, and in words in the rights statement.']
    - [hasCodingSystem, accessibility.formatAndStandards.vocabularyEncodingScheme, 'Health extension.']
    - [mediaType, accessibility.formatAndStandards.format, '']
    - [language, accessibility.formatAndStandards.language, '']
    - [temporal, provenance.temporal.startDate and endDate, '']
    - [accrualPeriodicity, provenance.temporal.publishingFrequency, 'Called provenance.temporal.accrualPeriodicity before version 4.']
    - [spatial, coverage.spatial, '']
    - [minTypicalAge, coverage.typicalAgeRangeMin, 'Health extension. Version 2 had one typicalAgeRange.']
    - [maxTypicalAge, coverage.typicalAgeRangeMax, 'Health extension.']
    - [numberOfUniqueIndividuals, summary.populationSize, 'Health extension. Subject to disclosure control.']
    - [trustedResearchEnvironment, accessibility.access.accessService, 'Health extension.']

croissant:
  label: Croissant 1.1 (ML datasets)
  their: Croissant and schema.org properties
  source: croissant
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://docs.mlcommons.org/croissant/docs/croissant-spec-1.1.html and https://docs.mlcommons.org/croissant/docs/croissant-rai-spec.html'
  note: Croissant describes datasets for machine learning on top of schema.org. DCAT-AP-UK fills its dataset-level part; record sets (the columns and their types) are added with Croissant tools. The record builder exports this part.
  rows:
    - [title, name, '']
    - [description, description, '']
    - [licence, license, '']
    - [landingPage, url, '']
    - [issued, datePublished, '']
    - [modified, dateModified, '']
    - [version, version, '']
    - [keyword, keywords, '']
    - [creator, creator, '']
    - [publisher, publisher, '']
    - [distribution, distribution (cr:FileObject), '']
    - [downloadURL, contentUrl, '']
    - [mediaType, encodingFormat, '']
    - [byteSize, contentSize, '']
    - [checksum, sha256, 'Only when the algorithm is SHA-256.']
    - [conformsTo, dct:conformsTo, 'The export adds the Croissant 1.1 specification address.']
    - [dataCard, rai:dataCollection and related RAI properties, 'AI-ready extension. The data card holds what the responsible AI properties ask.']

ddi:
  label: DDI Codebook (study level)
  their: DDI Codebook 2.5 elements
  source: ddi
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://ddialliance.org/Specification/DDI-Codebook/2.5/XMLSchema/codebook.xsd'
  note: The study-level elements most used to describe social science and survey data. The weaver reads and writes them as JSON with the element names as keys.
  rows:
    - [title, titl, '']
    - [identifier, IDNo, '']
    - [description, abstract, '']
    - [keyword, keyword, '']
    - [publisher, producer, '']
    - [creator, AuthEnty, 'Give organisation addresses, not people.']
    - [temporal, timePrd, '']
    - [spatial, geogCover, 'And nation.']
    - [rights, restrctn, 'And conditions.']
    - [landingPage, accsPlac, '']
    - [version, version, '']
    - [created, prodDate, '']
    - [issued, distDate, '']
    - [populationCoverage, universe, 'Health extension.']
    - [distribution, fileDscr, '']

dea-register:
  label: Digital Economy Act register of information sharing agreements
  their: Fields of an agreement in the register
  source: dea-register
  prov: V
  checked: '2026-11-22'
  checked_at: 'https://www.digital-economy-act-register.data.gov.uk/agreements/205'
  note: >-
    The register describes agreements, not datasets. These rows say how to describe a dataset or data service shared under one
    of them (ADR 0023). Field names as the register's agreement pages show them.
  rows:
    - [sharingMethod, Information sharing method, 'The register records one method per agreement; give every method the data moves by. Agreements 205, 284 and 663 record one method each yet say an API is also used.']
    - [qualifiedRelation, (none), 'Link the agreement''s page in the register, with the role ukcl:relation-role/sharing-agreement.']
    - [applicableLegislation, Power, 'Every power in the register is in Part 5 of the Digital Economy Act 2017: give https://www.legislation.gov.uk/ukpga/2017/30.']

