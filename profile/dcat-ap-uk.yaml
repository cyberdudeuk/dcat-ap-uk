  CatalogueRecord:
    uri: dcat:CatalogRecord
    label: Catalogue record
    ob: O
    icon: file-text
    definition: A record in a catalogue about one dataset or data service, with its own dates.
    mem: null
    properties:
      - {p: primaryTopic, ob: M, card: '1'}
      - {p: modified, ob: M, card: '1'}
      - {p: conformsTo, ob: R, card: 0..n}
      - {p: issued, ob: R, card: '0..1'}
      - {p: metadataAudience, ob: O, card: '0..1'}
      - {p: securityClassification, ob: O, card: '0..1'}
      - {p: missingValue, ob: O, card: 0..n}
      - {p: sourceRecord, ob: O, card: '0..1'}
      - {p: enrichedProperty, ob: O, card: 0..n}
  Agent:
    uri: foaf:Agent
    label: Organisation
    ob: M
    icon: building-2
    definition: An organisation that publishes, creates or is responsible for a resource. In this profile, never a person.
    mem: Organisation
    properties:
      - {p: name, ob: M, card: 1..n}
      - {p: identifier, ob: R, card: '0..1'}
      - {p: homepage, ob: O, card: '0..1'}
      - {p: agentType, ob: O, card: '0..1'}
  ContactPoint:
    uri: vcard:Kind
    label: Contact point
    ob: M
    icon: message-square
    definition: A team that can answer questions about a resource, with the routes to reach it.
    mem: ContactPoint
    one_of: [hasURL, hasEmail]
    properties:
      - {p: fn, ob: M, card: '1'}
      - {p: hasURL, ob: C, card: 0..n, condition: 'Give a contact form, a team mailbox, or both. A contact form is preferred.'}
      - {p: hasEmail, ob: C, card: 0..n, condition: 'Give a contact form, a team mailbox, or both. A contact form is preferred.'}
      - {p: hasTelephone, ob: O, card: 0..n}
      - {p: hasAddress, ob: O, card: '0..1'}
  Location:
    uri: dct:Location
    label: Location
    ob: O
    icon: map-pin
    definition: A named area or a shape on the earth. Prefer the identifier of a standard area, such as a GSS code.
    mem: null
    properties:
      - {p: locationName, ob: R, card: 0..n}
      - {p: bbox, ob: O, card: '0..1'}
      - {p: geometry, ob: O, card: '0..1'}
      - {p: centroid, ob: O, card: '0..1'}
  PeriodOfTime:
    uri: dct:PeriodOfTime
    label: Period of time
    ob: O
    icon: calendar-range
    definition: A period with a start date, an end date or both.
    mem: null
    one_of: [startDate, endDate]
    properties:
      - {p: startDate, ob: C, card: '0..1', condition: 'Give a start date, an end date, or both.'}
      - {p: endDate, ob: C, card: '0..1', condition: 'Give a start date, an end date, or both.'}
  Checksum:
    uri: spdx:Checksum
    label: Checksum
    ob: O
    icon: fingerprint
    definition: A value calculated from a file, used to check it has not changed.
    mem: null
    properties:
      - {p: algorithm, ob: M, card: '1'}
      - {p: checksumValue, ob: M, card: '1'}
  Relationship:
    uri: dcat:Relationship
    label: Relationship
    ob: O
    icon: link
    definition: How one resource relates to another.
    mem: null
    properties:
      - {p: relation, ob: M, card: 1..n}
      - {p: hadRole, ob: M, card: 1..n}
  Attribution:
    uri: prov:Attribution
    label: Responsible role
    ob: O
    icon: badge-check
    definition: An organisation and the role it plays for a resource, such as data owner.
    mem: null
    properties:
      - {p: agent, ob: M, card: '1'}
      - {p: hadRole, ob: M, card: '1'}
  MissingValue:
    uri: dcatuk:MissingValue
    label: Missing value
    ob: O
    icon: circle-help
    definition: A statement that one property is empty on purpose, and why, modelled on the nil reasons of GML and INSPIRE.
    mem: null
    properties:
      - {p: missingProperty, ob: M, card: '1'}
      - {p: missingReason, ob: M, card: '1'}

# Rules that need more than a single property shape. Each is enforced by the generated SHACL, the JSON Schema where it can be,
# and the browser validator. "issue" ties a rule to the backlog item that created it.
rules:
  - id: R-01
    text: A contact point must give a contact form, a team mailbox, or both.
    class: ContactPoint
  - id: R-02
    text: A period of time must have a start date, an end date, or both.
    class: PeriodOfTime
  - id: R-03
    text: When access rights are commercial or internal, give a rights statement saying how to ask for the data.
    class: Dataset
    issue: 44
  - id: R-04
    text: When the record describes a critical data asset, the properties marked mandatory for critical data assets must be given.
    class: Dataset
  - id: R-05
    text: The summary must be 250 characters or fewer.
    class: Dataset
  - id: R-06
    text: A team email address must be a mailto address. A contact form must be a web address.
    class: ContactPoint
    issue: 71
  - id: R-07
    text: A period's end date must not be before its start date.
    class: PeriodOfTime
    issue: 2
  - id: R-08
    text: When the data contains personal data and is held in or sent to anywhere outside the UK, give the transfer safeguard.
    class: Dataset
