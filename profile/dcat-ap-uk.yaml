      - {p: issued, ob: R, card: '0..1'}
      - {p: abstract, ob: R, card: '0..1'}
      - {p: theme, ob: R, card: 0..n}
      - {p: keyword, ob: R, card: 0..n}
      - {p: spatial, ob: R, card: 0..n}
      - {p: distribution, ob: R, card: 0..n}
      - {p: landingPage, ob: R, card: 0..n}
      - {p: version, ob: R, card: '0..1'}
      - {p: sensitiveData, ob: R, card: 0..n}
      - {p: qualifiedAttribution, ob: O, card: 0..n, cda: R}
      - {p: language, ob: O, card: 0..n}
      - {p: alternative, ob: O, card: 0..n}
      - {p: otherIdentifier, ob: O, card: 0..n}
