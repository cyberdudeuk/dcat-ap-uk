      - {p: documentation, ob: O, card: 0..n}
      - {p: metadataAudience, ob: O, card: '0..1'}
      - {p: applicableLegislation, ob: O, card: 0..n}
      - {p: hasPolicy, ob: O, card: 0..n}
      - {p: jurisdiction, ob: O, card: 0..n}
      - {p: transferMechanism, ob: C, card: 0..n, condition: 'Mandatory when the data contains personal data and is held in or sent to anywhere outside the UK (rule R-08).'}
      - {p: missingValue, ob: O, card: 0..n}
  DataService:
    uri: dcat:DataService
    label: Data service
    ob: R
    icon: plug
    definition: A set of operations, such as an API, that gives access to one or more datasets or data processing functions.
    mem: DataService
    properties:
      - {p: title, ob: M, card: 1..n}
      - {p: description, ob: M, card: 1..n}
      - {p: identifier, ob: M, card: '1'}
      - {p: endpointURL, ob: M, card: 1..n}
      - {p: publisher, ob: M, card: '1'}
      - {p: contactPoint, ob: M, card: 1..n}
      - {p: accessRights, ob: M, card: '1'}
      - {p: securityClassification, ob: M, card: '1'}
      - {p: licence, ob: M, card: '1'}
      - {p: serviceStatus, ob: M, card: '1'}
      - {p: serviceType, ob: R, card: '0..1'}
      - {p: conformsTo, ob: R, card: 0..n}
      - {p: endpointDescription, ob: R, card: 0..n}
      - {p: servesDataset, ob: R, card: 0..n}
      - {p: criticalDataAsset, ob: O, card: '0..1'}
      - {p: rights, ob: C, card: 0..n, condition: 'Mandatory when access rights are commercial or internal.'}
      - {p: creator, ob: O, card: 0..n}
      - {p: issued, ob: R, card: '0..1'}
      - {p: modified, ob: R, card: '0..1'}
      - {p: abstract, ob: O, card: '0..1'}
      - {p: theme, ob: R, card: 0..n}
      - {p: keyword, ob: R, card: 0..n}
      - {p: version, ob: O, card: '0..1'}
      - {p: landingPage, ob: O, card: 0..n}
      - {p: documentation, ob: O, card: 0..n}
      - {p: language, ob: O, card: 0..n}
      - {p: personalData, ob: O, card: '0..1'}
      - {p: metadataAudience, ob: O, card: '0..1'}
      - {p: applicableLegislation, ob: O, card: 0..n}
      - {p: hasPolicy, ob: O, card: 0..n}
      - {p: jurisdiction, ob: O, card: 0..n}
      - {p: transferMechanism, ob: C, card: 0..n, condition: 'Mandatory when the data contains personal data and is held in or sent to anywhere outside the UK (rule R-08).'}
      - {p: transportSecurity, ob: O, card: '0..1'}
      - {p: missingValue, ob: O, card: 0..n}
  Distribution:
    uri: dcat:Distribution
    label: Distribution
    ob: R
    icon: file-down
    definition: A specific form of a dataset, such as a CSV file, a GeoPackage or an API response.
    mem: Distribution
    properties:
      - {p: accessURL, ob: M, card: 1..n}
      - {p: mediaType, ob: R, card: '0..1'}
      - {p: downloadURL, ob: R, card: 0..n}
      - {p: description, ob: R, card: 0..n}
      - {p: licence, ob: R, card: '0..1'}
      - {p: title, ob: O, card: 0..n}
      - {p: format, ob: O, card: '0..1'}
      - {p: byteSize, ob: O, card: '0..1'}
      - {p: checksum, ob: O, card: '0..1'}
      - {p: accessService, ob: O, card: 0..n}
      - {p: accessRights, ob: O, card: '0..1'}
      - {p: issued, ob: O, card: '0..1'}
      - {p: modified, ob: O, card: '0..1'}
      - {p: conformsTo, ob: O, card: 0..n}
      - {p: language, ob: O, card: 0..n}
      - {p: compressFormat, ob: O, card: '0..1'}
      - {p: identifier, ob: O, card: '0..1'}
