    - {code: bat, label: 'British Antarctic Territory', groups: [overseas-territory], definition: 'Has no ISO 3166-1 code of its own; this code is this profile’s.'}
    - {code: io, label: 'British Indian Ocean Territory', groups: [overseas-territory]}
