transfer-mechanism:
  label: Transfer safeguards
  definition: The bases in UK GDPR for sending personal data outside the UK, as the ICO guidance of 15 January 2026 sets them out (provenance S).
  concepts:
    - {code: not-restricted, label: Not a restricted transfer, definition: 'The ICO three-step test shows the flow is not a restricted transfer, for example because the receiver is not a separate legal entity, or the data is not personal data in the receiver''s hands.'}
    - {code: uk-adequacy, label: UK adequacy regulations, definition: 'The receiver is in a country, territory or international organisation covered in full by UK adequacy regulations.'}
    - {code: uk-adequacy-partial, label: Partial UK adequacy regulations, definition: 'Covered by adequacy regulations for a sector or a class of receiver only, such as organisations certified to the UK-US data bridge.'}
    - {code: idta, label: International data transfer agreement (IDTA), definition: 'The ICO international data transfer agreement.'}
    - {code: addendum, label: UK Addendum to the EU standard contractual clauses, definition: 'The EU standard contractual clauses with the ICO UK Addendum.'}
    - {code: bcr, label: Binding corporate rules, definition: 'Binding corporate rules approved by the ICO, for transfers within a group.'}
    - {code: public-body-instrument, label: Instrument between public authorities, definition: 'A legally binding and enforceable instrument between public authorities or bodies.'}
    - {code: administrative-arrangement, label: Administrative arrangement between public bodies, definition: 'Provisions in an administrative arrangement between public authorities or bodies, authorised by the ICO.'}
    - {code: code-or-certification, label: Approved code of conduct or certification, definition: 'An approved code of conduct or certification scheme, with binding commitments from the receiver.'}
    - {code: exception, label: An exception (derogation), definition: 'One of the exceptions in Article 49 UK GDPR, such as explicit consent or important reasons of public interest. For occasional transfers only.'}
    - {code: law-enforcement, label: Law enforcement transfer rules, definition: 'A transfer by a competent authority under Part 3 of the Data Protection Act 2018, which has its own rules.'}

checksum-algorithm:
  label: Checksum algorithms
  definition: Algorithms in the SPDX list for checking a file has not changed, with this profile's advice on each for long-term and quantum-era trust.
  compact_from_uri: true
  concepts:
    - {code: sha256, label: 'SHA-256', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha256', compact: 'spdx:checksumAlgorithm_sha256', status: acceptable, definition: 'Acceptable today and through the quantum transition for integrity checks. Prefer longer outputs for files that must be trusted for decades.'}
    - {code: sha384, label: 'SHA-384', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha384', compact: 'spdx:checksumAlgorithm_sha384', status: recommended, definition: 'Recommended for long-lived records.'}
    - {code: sha512, label: 'SHA-512', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha512', compact: 'spdx:checksumAlgorithm_sha512', status: recommended, definition: 'Recommended for long-lived records.'}
    - {code: sha3-256, label: 'SHA3-256', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha3_256', compact: 'spdx:checksumAlgorithm_sha3_256', status: acceptable, definition: 'A different design from SHA-2; acceptable, and useful for crypto-agility.'}
    - {code: sha3-384, label: 'SHA3-384', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha3_384', compact: 'spdx:checksumAlgorithm_sha3_384', status: recommended, definition: 'Recommended for long-lived records.'}
    - {code: sha3-512, label: 'SHA3-512', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha3_512', compact: 'spdx:checksumAlgorithm_sha3_512', status: recommended, definition: 'Recommended for long-lived records.'}
    - {code: blake2b-256, label: 'BLAKE2b-256', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_blake2b256', compact: 'spdx:checksumAlgorithm_blake2b256', status: acceptable, definition: 'Acceptable.'}
    - {code: blake2b-512, label: 'BLAKE2b-512', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_blake2b512', compact: 'spdx:checksumAlgorithm_blake2b512', status: acceptable, definition: 'Acceptable.'}
    - {code: blake3, label: 'BLAKE3', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_blake3', compact: 'spdx:checksumAlgorithm_blake3', status: acceptable, definition: 'Acceptable.'}
    - {code: sha224, label: 'SHA-224', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha224', compact: 'spdx:checksumAlgorithm_sha224', status: deprecated, definition: 'Too short for new records. Use SHA-256 or longer.'}
    - {code: sha1, label: 'SHA-1', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_sha1', compact: 'spdx:checksumAlgorithm_sha1', status: deprecated, definition: 'Broken against deliberate collisions. Kept so old records still conform; the validator warns (rule Q-01).'}
    - {code: md5, label: 'MD5', uri: 'http://spdx.org/rdf/terms#checksumAlgorithm_md5', compact: 'spdx:checksumAlgorithm_md5', status: deprecated, definition: 'Broken. Kept so old records still conform; the validator warns (rule Q-01).'}

transport-security:
  label: Connection security
  definition: The key exchange a service's endpoint uses to protect data in transit, for the post-quantum migration inventory.
  concepts:
    - {code: pqc-hybrid, label: Hybrid post-quantum, definition: 'Negotiates a post-quantum key exchange (ML-KEM, FIPS 203) combined with a classical one, such as X25519MLKEM768 in TLS 1.3.'}
    - {code: pqc-only, label: Post-quantum only, definition: 'Negotiates a post-quantum key exchange alone.'}
    - {code: tls13-classical, label: TLS 1.3 with classical key exchange, definition: 'Secure against today''s attackers, but data recorded now could be decrypted later by a quantum computer (harvest now, decrypt later). Plan the migration.'}
    - {code: tls12-classical, label: TLS 1.2 with classical key exchange, definition: 'Upgrade to TLS 1.3 first; post-quantum key exchange needs it.'}
    - {code: not-assessed, label: Not yet assessed, definition: 'Not yet checked. Checking is part of the discovery work the NCSC asks for by 2028.'}

ai-use:
  label: Use for artificial intelligence
  definition: Whether the data may be used to train, fine-tune or evaluate AI models. Used by the AI-ready extension. Provisional.
  concepts:
    - {code: permitted, label: Training permitted, definition: 'The data may be used to train and fine-tune AI models under its licence, with no further conditions.'}
    - {code: permitted-with-conditions, label: Training permitted with conditions, definition: 'The data may be used for AI training under conditions in the usage policy or rights statement, such as attribution, non-commercial use or a data sharing agreement.'}
    - {code: evaluation-only, label: Evaluation only, definition: 'The data may be used to test or evaluate AI models, but not to train them.'}
    - {code: not-permitted, label: Not permitted, definition: 'The data must not be used to train, fine-tune or evaluate AI models.'}
    - {code: not-assessed, label: Not yet assessed, definition: 'The owner has not decided. Treat as not permitted until they do.'}

statistics-status:
  label: Official statistics status
  definition: The status of statistics under the Code of Practice for Statistics, as the Office for Statistics Regulation names them. Used by the statistics extension (provenance K).
  concepts:
    - {code: accredited-official, label: Accredited official statistics, definition: 'Official statistics the Office for Statistics Regulation has assessed as complying with the Code of Practice.'}
    - {code: official, label: Official statistics, definition: 'Statistics produced by a body named as producing official statistics.'}
    - {code: official-in-development, label: Official statistics in development, definition: 'New or changed official statistics still being developed and tested with users.'}
    - {code: management-information, label: Management information, definition: 'Data used to run a service, not published as official statistics.'}
    - {code: other, label: Other statistics, definition: 'Statistics from a body that does not produce official statistics, such as a charity or company.'}

open-data-triage:
  label: Open data triage outcome
  definition: The outcome of open data triage for data that is presumed open, as in the energy sector's Data Best Practice guidance. Used by the energy extension (provenance K).
  concepts:
    - {code: open, label: Open, definition: 'Published for anyone to use, under an open licence.'}
    - {code: public, label: Public, definition: 'Available to anyone, but under a licence with conditions that make it not open.'}
    - {code: shared, label: Shared, definition: 'Shared with named people or organisations, or groups of them, under conditions.'}
    - {code: closed, label: Closed, definition: 'Not shared outside the organisation, for reasons recorded in the triage, such as security or privacy.'}
