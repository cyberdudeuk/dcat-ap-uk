# The DCAT-AP-UK requirements stream: what communities need from the profile, how each need is evidenced,
# and how it is met, traced to properties, rules, tests and pages.
#
# Handling rule (ADR 0015): this file is public. It names kinds of community, never people, meetings, forums or
# documents from internal engagement, and it carries nothing from controlled specifications. Requirements that can
# only be specified or tested with controlled material are listed with status "controlled": their detail lives
# outside this repository. tools/check_site.py C-22 enforces this.

intro: >-
  Over the last year the same need has come up in many places: catalogue owners, departments putting the Data Asset
  Management Policy into practice, national discovery services, defence and security users, policing and geospatial
  teams. They are not asking for the same standard. They are asking for the same architecture: a common DCAT core,
  governed specialist layers, clear access and handling semantics, machine-readable validation, provenance that
  survives harvesting, and mappings that say what they lose.

method: >-
  Requirements come from cross-government engagement and from public sources. Engagement records are not published:
  people, meetings and documents are withheld, so each requirement says only what kind of community raised it.
  Public sources are linked and dated. A requirement is met only when a property, rule or test shows it.

evidence:
  E: {label: Engagement, text: 'Raised in cross-government engagement. The record is not published.'}
  V: {label: Verified, text: 'Checked against a public primary source on the date given.'}
  O: {label: Operating rule, text: 'A rule this profile sets for itself.'}

communities:
  - {id: catalogues, label: Catalogue owners and platform teams, icon: library}
  - {id: dam, label: Departments implementing data asset management, icon: clipboard-check}
  - {id: discovery, label: National discovery and data library services, icon: search}
  - {id: defence, label: Defence and security users, icon: shield-check}
  - {id: policing, label: Policing and justice, icon: scale}
  - {id: geo, label: Geospatial publishers, icon: map}
  - {id: international, label: International and allied partners, icon: globe}
  - {id: statistics, label: Official statistics producers, icon: chart-column}
  - {id: geodesy, label: Geodesy and positioning specialists, icon: target}

public_sources:
  - {id: dsa-dcat, label: 'Using metadata to describe data assets in a data catalogue (Data Standards Authority)', url: 'https://www.gov.uk/government/publications/recommended-open-standards-for-government/using-metadata-to-describe-data-assets-in-a-data-catalogue', checked: '2026-11-06', says: 'DCAT version 3 is endorsed for describing datasets and data services, for example when connecting departmental catalogues to the central Government Data Catalogue, and can be used with other open standards such as DQV.'}
  - {id: ncms, label: 'NATO Core Metadata Specification, ADatP-5636 Edition A Version 1', url: 'https://nhqc3s.hq.nato.int/apps/architecture/nisp/volume1/apd.html', checked: '2026-11-06', says: 'A NATO standard, accepted in 2022 and listed in the NATO Interoperability Standards and Profiles, for core metadata used to find and share data; published detail is limited.'}
  - {id: defence-data, label: 'Data Strategy for Defence (Ministry of Defence, 2021)', url: 'https://www.gov.uk/government/publications/data-strategy-for-defence/data-strategy-for-defence', checked: '2026-11-06', says: 'Sets Defence data rules and the aim of curated data flowing between users and platforms, nationally and internationally.'}
  - {id: pds-interop, label: 'Interoperability Handbook (Police Digital Service, 2026)', url: 'https://knowledgehub.group/web/national-standards/live-standards/-/ddl_display/ddl/446355907/362284494/maximized', checked: '2026-11-06', says: 'Guidance on interoperability across policing and law enforcement systems, in layers from organisational to foundational.'}
  - {id: nilreason, label: 'NilReasonType vocabulary (GML 3.2, as published by Eionet for INSPIRE reporting)', url: 'https://dd.eionet.europa.eu/vocabulary/common/NilReasonType/view', checked: '2026-11-06', says: 'Standard reasons for a void value, including unknown, withheld, inapplicable, unpopulated and template.'}

principles:
  - {id: P1, text: 'A common core, with governed layers for specialist needs. No single profile carries everything.'}
  - {id: P2, text: 'Neutral about technology and supplier. Platforms connect through mappings, never by becoming the standard.'}
  - {id: P3, text: 'Being able to find a record never implies being allowed to have the data.'}
  - {id: P4, text: 'The record and the data can be handled differently. Each can say how it must be handled.'}
  - {id: P5, text: 'Provenance survives harvesting and mapping: who said what, and where it came from.'}
  - {id: P6, text: 'Every rule is machine-readable, and three validators give one verdict.'}
  - {id: P7, text: 'A mapping says what it loses.'}
  - {id: P8, text: 'Existing catalogues connect through mappings and adapters, not by being replaced.'}
  - {id: P9, text: 'Public artefacts never carry controlled semantics. Controlled layers are specified and tested elsewhere.'}
  - {id: P10, text: 'Built in the open wherever security allows.'}

layers:
  - {id: foundation, level: L0, label: Foundation standards, status: met, text: 'DCAT 3, DCTERMS, SKOS, PROV-O, DQV and the other W3C and OGC vocabularies every layer builds on.', link: 'standards.html'}
  - {id: core, level: L1, label: DCAT-AP-UK core, status: met, text: 'The common spine for UK government catalogues, aligned with DCAT-AP 3.0.1. Required of every catalogue.', link: 'profile.html'}
  - {id: geo, level: L2, label: Geospatial (GeoDCAT-UK), status: partly, text: 'Location, coordinate reference systems, resolution and lineage, reusing GeoDCAT-AP and mapped to UK GEMINI. Required for geospatial datasets, series and services.', link: 'extensions.html#ext-geospatial'}
  - {id: geodesy, level: L3, label: Geodesy module, status: partly, text: 'A candidate module for reference frames, epochs, observation techniques and uncertainty, without loading them onto the core.', link: 'extensions.html#ext-geodesy'}
  - {id: controlled, level: L4, label: Controlled partner overlays, status: controlled, text: 'Defence, security and allied exchange: stricter validation, handling and control semantics, applied only in partner exchanges. Specified, governed and tested outside this public repository.', link: '#controlled'}
  - {id: dam, level: Alongside, label: Data asset management layer, status: partly, text: 'What critical data asset reporting needs: ownership, criticality and provenance.', link: 'class-dataset.html'}
  - {id: sector, level: Alongside, label: Other sector extensions, status: met, text: 'Health, statistics, transport, energy, high-value datasets, AI-ready and data spaces, each a module of its own.', link: 'extensions.html'}
  - {id: mappings, level: Alongside, label: Platform and standard mappings, status: partly, text: 'Crosswalks and the weaver for catalogue platforms and other standards, each saying what it loses.', link: 'weaver.html'}

themes:
  - {id: interop, label: Interoperability between standards, icon: arrow-left-right}
  - {id: security, label: Security and access semantics, icon: shield-check}
  - {id: conformance, label: Conformance and validation, icon: badge-check}
  - {id: provenance, label: Provenance and mapping, icon: git-branch}
  - {id: adoption, label: Adoption across environments, icon: building-2}
  - {id: governance, label: Governance and openness, icon: landmark}

statuses:
  met: {label: Met, text: 'A property, rule or test shows it.'}
  partly: {label: Partly met, text: 'Some of it is shown; the gap is stated.'}
  planned: {label: Planned, text: 'Not yet built. It is in the work programme.'}
  controlled: {label: Controlled, text: 'Needs controlled material. Handled outside this public repository; no claim is made here.'}

requirements:
  - id: RQ-01
    theme: interop
    statement: Records can be exchanged with international and allied DCAT-based profiles without bespoke translation for each pair.
    rationale: Every bespoke translation is a cost and a place where meaning is lost.
    communities: [international, defence, catalogues]
    evidence: [E]
    sources: [dsa-dcat]
    priority: must
    layer: mappings
    acceptance: For each listed profile, a crosswalk exists and a round trip through the weaver keeps every mandatory value.
    validation: tests/test_integrations.py Weaver round trip
    traces: {pages: [weaver.html, changes.html], tests: ['Weaver round trip']}
    status: partly
    gap: Crosswalks cover CKAN, Dublin Core, UK GEMINI, HDR UK, Croissant and DDI, and the weaver also reads and writes DCAT-US and schema.org. Allied profiles that are not public are out of scope here.
  - id: RQ-02
    theme: security
    statement: Finding a record never grants access to the data. Who may have the data is stated separately from who may see the record.
    rationale: Discovery across government only works if publishing a record does not expose the data.
    communities: [defence, dam, discovery]
    evidence: [E]
    priority: must
    layer: core
    acceptance: Datasets and data services carry access rights; catalogue records carry their own audience.
    validation: SHACL and JSON Schema shapes for accessRights and metadataAudience
    traces: {properties: [accessRights, metadataAudience, rights]}
    status: met
  - id: RQ-03
    theme: security
    statement: A catalogue record can say how the record itself must be handled, separately from the handling of the data it describes.
    rationale: A record about protected data is often itself OFFICIAL, and a shared catalogue needs to know that.
    communities: [defence, catalogues]
    evidence: [E]
    priority: must
    layer: core
    acceptance: Catalogue records take a security classification of their own, from the same list as datasets.
    validation: Generated shapes for CatalogueRecord; class page diagram
    traces: {properties: [securityClassification, metadataAudience], pages: [class-cataloguerecord.html]}
    status: met
    added: '1.2.0-rc.1'
  - id: RQ-04
    theme: conformance
    statement: A record can say why a property is empty (unknown, withheld, not applicable, not collected or not yet available), so a strict harvester need not guess.
    rationale: Stricter validators treat an absent value as an error. An explicit reason lets them tell a withheld value from a forgotten one.
    communities: [defence, discovery, geo]
    evidence: [E]
    sources: [nilreason]
    priority: should
    layer: core
    acceptance: Missing values are structured, use a controlled list of reasons, and never satisfy a mandatory property (rule Q-02).
    validation: tests/test_toolkit.py MissingValues; tests/fixtures/invalid.yaml missing-value-bad-reason and missing-value-no-reason
    traces: {properties: [missingValue, missingProperty, missingReason], pages: [class-missingvalue.html, codelists.html], fixtures: [missing-value-bad-reason, missing-value-no-reason]}
    status: met
    added: '1.2.0-rc.1'
  - id: RQ-05
    theme: conformance
    statement: Validation is machine-readable and gives one verdict wherever it runs.
    rationale: A record that passes in one tool and fails in another cannot be trusted by either.
    communities: [catalogues, discovery, defence]
    evidence: [E, O]
    priority: must
    layer: core
    acceptance: pySHACL, JSON Schema and validator.js agree on every example and every deliberate break.
    validation: tests/test_profile.py every example passes all three; every break fails all three
    traces: {pages: [validate.html, downloads.html], tests: ['every example passes all three', 'every break fails all three']}
    status: met
  - id: RQ-06
    theme: conformance
    statement: Conformance is claimed by level and by layer, and only after the matching tests pass.
    rationale: A single yes or no hides what a catalogue can actually exchange.
    communities: [catalogues, defence, dam]
    evidence: [E]
    priority: must
    layer: core
    acceptance: The conformance kit gives levels 1 to 3 for the core. Each further layer gets its own test records before anyone may claim it.
    validation: downloads/conformance-kit.json expected verdicts
    traces: {pages: [integrations.html]}
    status: partly
    gap: Levels exist for the core only. Layer claims (data asset management, sectors, controlled overlays) are planned.
  - id: RQ-07
    theme: interop
    statement: Specialist terms live in their own namespaces, as modules that can be required or left out as a whole.
    rationale: Modules let a community be strict about its own terms without making everyone else carry them.
    communities: [defence, geo, catalogues]
    evidence: [E]
    priority: should
    layer: sector
    acceptance: Each extension is a module with its own mandatory and optional properties, using its sector's vocabulary, merged by one function.
    validation: Profile.with_extensions; extension tests in check_browser (break extension)
    traces: {pages: [extensions.html]}
    status: partly
    gap: Extensions reuse their sectors' namespaces. New UK-only terms still go in the one dcatuk namespace; a namespace per module is not yet decided.
  - id: RQ-08
    theme: provenance
    statement: The authoritative source of a record, and of each value changed on the way, survives harvesting and mapping.
    rationale: Enriched or merged records that look like the original mislead people about who is accountable.
    communities: [discovery, catalogues, dam]
    evidence: [E]
    priority: must
    layer: core
    acceptance: Records carry publisher, creator and qualified attribution; harvested copies keep the original identifier, point to the record they came from (source record) and list the properties they enriched.
    validation: Generated shapes; weaver notes; worked example record-harvested
    traces: {properties: [publisher, creator, qualifiedAttribution, identifier, otherIdentifier, sourceRecord, enrichedProperty]}
    status: met
  - id: RQ-09
    theme: provenance
    statement: Every mapping says what it loses.
    rationale: Silent loss is worse than visible loss.
    communities: [catalogues, international]
    evidence: [E, O]
    priority: must
    layer: mappings
    acceptance: The weaver returns notes on values it changes or drops, and the crosswalk matrix marks partial and missing matches.
    validation: tests/test_integrations.py Weaver
    traces: {pages: [weaver.html]}
    status: partly
    gap: Notes are written by hand for each reader and writer, so a new mapping could drop a value without a note. A generic loss report is planned.
  - id: RQ-10
    theme: adoption
    statement: Asset, dataset, data product, data service and distribution have one meaning each, which policy and catalogues share.
    rationale: Departments reporting under the same policy count different things when the words differ.
    communities: [dam, catalogues]
    evidence: [E]
    priority: must
    layer: dam
    acceptance: Each term has a definition, a class or a stated mapping to one, and an entry in the glossary.
    validation: Glossary and class pages
    traces: {pages: [knowledge.html, class-dataset.html, class-dataservice.html, class-distribution.html]}
    status: partly
    gap: Data product has no class of its own and no agreed mapping yet.
  - id: RQ-11
    theme: adoption
    statement: Organisations without an enterprise catalogue can still describe their assets, from a spreadsheet, and be found.
    rationale: Discovery should not wait for every department to buy a catalogue.
    communities: [dam, discovery]
    evidence: [E]
    priority: should
    layer: core
    acceptance: The bulk checker reads a spreadsheet (CSV) and gives a verdict for every row.
    validation: tools/check_browser.py bulk (break bulk)
    traces: {pages: [bulk.html]}
    status: met
  - id: RQ-12
    theme: adoption
    statement: The profile works with the catalogue platforms departments already run, through configuration or adapters.
    rationale: Replacing platforms to adopt a standard is the lock-in the standard is meant to prevent.
    communities: [catalogues, dam]
    evidence: [E]
    priority: must
    layer: mappings
    acceptance: Each named platform has an integration pattern and a test route through the conformance kit.
    validation: integrations page; conformance kit
    traces: {pages: [integrations.html, lockin.html]}
    status: partly
    gap: Product entries are background knowledge until each supplier confirms them (open register O-19).
  - id: RQ-13
    theme: adoption
    statement: Validation works in disconnected and air-gapped environments, with no calls to the network.
    rationale: Many protected environments cannot reach the internet.
    communities: [defence]
    evidence: [E]
    priority: must
    layer: core
    acceptance: The validator, its profile file and the command line run offline; validator.js makes no network calls.
    validation: tests/test_toolkit.py Offline
    traces: {pages: [integrations.html]}
    status: met
    added: '1.2.0-rc.1'
  - id: RQ-14
    theme: security
    statement: The public profile describes OFFICIAL information only. Anything needing higher classifications is handled in controlled layers.
    rationale: An OFFICIAL catalogue must not become a list of protected holdings.
    communities: [defence, dam]
    evidence: [E, O]
    priority: must
    layer: core
    acceptance: The security classification guidance says records about SECRET or TOP SECRET data do not belong in an OFFICIAL catalogue; the portal carries no protective markings.
    validation: tools/check_site.py C-22
    traces: {properties: [securityClassification]}
    status: met
  - id: RQ-15
    theme: interop
    statement: Where allied exchange needs it, DCAT-AP-UK maps to the NATO Core Metadata Specification and its confidentiality labelling.
    rationale: Defence data shared with allies is described in NATO's own core metadata.
    communities: [defence, international]
    evidence: [E, V]
    sources: [ncms, defence-data]
    priority: could
    layer: controlled
    acceptance: A mapping reviewed against authorised sources. No conformance claim is made until then.
    validation: Outside this repository
    traces: {pages: [standards.html]}
    status: controlled
  - id: RQ-16
    theme: interop
    statement: Geospatial records reference GEMINI rather than repeat it.
    rationale: Two sources of truth for the same geospatial terms drift apart.
    communities: [geo, catalogues]
    evidence: [E]
    priority: should
    layer: geo
    acceptance: The geospatial extension is aligned to GeoDCAT-AP and UK GEMINI, with a crosswalk to GEMINI, and defines nothing they already define.
    validation: Extension tests
    traces: {pages: [extensions.html, standards.html]}
    status: partly
    gap: Review of the crosswalk by geospatial specialists is planned.
  - id: RQ-17
    theme: governance
    statement: Catalogues and information asset registers work together without becoming two registers of the same things.
    rationale: Duplicate registers disagree, and people stop trusting both.
    communities: [dam, catalogues]
    evidence: [E]
    priority: should
    layer: dam
    acceptance: A stated mapping between register fields and DCAT-AP-UK properties, tested on a real register extract.
    validation: Planned
    traces: {pages: [strategy.html]}
    status: planned
  - id: RQ-18
    theme: governance
    statement: Public artefacts never expose controlled semantics, and never name people or meetings from internal engagement.
    rationale: Openness is the default, but aggregation can reveal what single facts do not.
    communities: [defence]
    evidence: [O]
    priority: must
    layer: core
    acceptance: A check fails the build if requirements or pages carry protective markings or controlled-specification terms.
    validation: tools/check_site.py C-22 (deliberate break registered)
    traces: {pages: [requirements.html]}
    status: met
    added: '1.2.0-rc.1'
  - id: RQ-19
    theme: governance
    statement: Missing metadata is collected from the business areas that hold it, without a central team re-keying it.
    rationale: Departments often do not hold all the metadata centrally.
    communities: [dam]
    evidence: [E]
    priority: should
    layer: dam
    acceptance: Guidance and a bulk route for business areas to supply and verify their own entries.
    validation: Planned
    traces: {pages: [bulk.html, adopt.html]}
    status: partly
    gap: The bulk checker exists; the commissioning guidance does not.
  - id: RQ-20
    theme: interop
    statement: Policing and justice systems can describe shared data with the same core, alongside their own interoperability layers.
    rationale: Interoperability in policing is organised in layers that a common metadata core can sit inside.
    communities: [policing]
    evidence: [V]
    sources: [pds-interop]
    priority: could
    layer: core
    acceptance: A worked mapping from the core to the semantic layer of policing interoperability guidance.
    validation: Planned
    traces: {pages: [standards.html]}
    status: planned

  - id: RQ-21
    theme: interop
    statement: Metadata held in a catalogue platform's own model, such as the Apache Atlas types behind Microsoft Purview, converts to DCAT-AP-UK through a mapping layer, not by re-keying.
    rationale: Departments adopting a platform should not have to choose between its tooling and cross-government discovery.
    communities: [catalogues, dam, discovery]
    evidence: [E]
    priority: must
    layer: mappings
    acceptance: The weaver reads Atlas v2 entities, turns epoch times into dates, keeps GUIDs only as identifiers, and names every DCAT-AP-UK property the entity cannot supply.
    validation: tests/test_integrations.py AtlasReader; weaver sample
    traces: {properties: [identifier, issued, modified, keyword, theme, securityClassification], pages: [weaver.html, integrations.html]}
    status: met
    added: '1.2.0-rc.1'
  - id: RQ-22
    theme: provenance
    statement: A mapping never invents a value. No default description, licence, language, contact name or classification; a missing value stays missing and is reported.
    rationale: A plausible default is worse than a gap, because nobody goes back to check it. Defaulting an unlabelled asset to OFFICIAL is a security decision nobody made.
    communities: [catalogues, defence, discovery]
    evidence: [E, O]
    priority: must
    layer: mappings
    acceptance: No reader in the weaver sets a value the source does not hold; each gap becomes a note.
    validation: tests/test_integrations.py AtlasReader nothing is invented
    traces: {pages: [weaver.html]}
    status: met
    added: '1.2.0-rc.1'
  - id: RQ-23
    theme: interop
    statement: Precise positions say which reference frame and epoch they are in, how they were observed and how uncertain they are, at a stated confidence.
    rationale: The same point has different coordinates in different frames and at different dates; mixing them silently is an error of centimetres to metres.
    communities: [geodesy, geo, defence]
    evidence: [E]
    priority: should
    layer: geodesy
    acceptance: A geodesy module with frame, epoch, vertical reference, technique and uncertainty with confidence, and deliberate breaks.
    validation: Extension breaks geodesy-without-frame and geodesy-bad-technique
    traces: {pages: [extensions.html], fixtures: [geodesy-without-frame, geodesy-bad-technique]}
    status: partly
    gap: A candidate for review by geodetic specialists. Rules linking uncertainty to confidence, and frame to epoch, are not yet enforced.
    added: '1.2.0-rc.1'
  - id: RQ-24
    theme: conformance
    statement: Geospatial records state their coordinate reference system, give resolution with a unit, and say how the data is represented; geospatial services state the OGC standards they conform to.
    rationale: These are the facts a geospatial user checks first, and the ones generic discovery metadata leaves out.
    communities: [geo, catalogues]
    evidence: [E]
    priority: should
    layer: geo
    acceptance: Shapes in the geospatial extension for each of the four, with deliberate breaks.
    validation: Extension breaks geo-without-crs and geo-bad-representation; a data service without conforms to fails under the extension
    traces: {properties: [conformsTo, spatialResolutionInMeters], pages: [extensions.html], fixtures: [geo-without-crs, geo-bad-representation]}
    status: met
  - id: RQ-25
    theme: conformance
    statement: A record declares which profile, layers and versions it was written to.
    rationale: A harvester cannot apply the right rules, or migrate a record, if it does not know which ones it was made against.
    communities: [catalogues, discovery, defence]
    evidence: [E]
    priority: should
    layer: core
    acceptance: Catalogue records give the profile and each layer as versioned identifiers in conforms to.
    validation: Generated shapes for CatalogueRecord; worked example record-harvested
    traces: {properties: [conformsTo], pages: [class-cataloguerecord.html]}
    status: partly
    gap: The property exists, but there is no published identifier per layer version yet, and no rule checks that the identifier is a known one.
  - id: RQ-26
    theme: governance
    statement: A release passes four gates. Reuse is assessed for every new term; every rule is traced to a test; no serious semantic-loss or disclosure defect is open; compatibility is claimed only with evidence.
    rationale: Gates make "ready" a fact anyone can check rather than an opinion.
    communities: [catalogues, defence, geo]
    evidence: [E, O]
    priority: must
    layer: core
    acceptance: Each gate has a check in the release workflow or a recorded decision, shown on this page.
    validation: Release gates table below
    traces: {pages: [governance.html, requirements.html]}
    status: partly
    gap: Traceable tests and the defect register are enforced; reuse assessment is recorded per property but not as a gate, and semantic-loss defects are not graded by severity.
  - id: RQ-27
    theme: governance
    statement: UK profiles agree which properties are mandatory, recommended and optional, so a record that conforms to one is not rejected by another.
    rationale: Profiles built for statistics and for cross-government catalogues drifted apart on obligations, so the same record passed one and failed the other.
    communities: [statistics, catalogues]
    evidence: [E]
    priority: must
    layer: core
    acceptance: A published comparison of obligations with each UK profile, and a decision on every difference.
    validation: Planned
    traces: {pages: [changes.html]}
    status: planned
  - id: RQ-28
    theme: governance
    statement: Every requirement can be followed from its evidence to the properties, rules, tests, decisions and release that meet it.
    rationale: A requirement that cannot be traced cannot be shown to be met, or safely changed.
    communities: [catalogues, defence, dam]
    evidence: [O]
    priority: must
    layer: core
    acceptance: The lineage explorer links each requirement to what traces it; the chain below counts each link.
    validation: tests/test_integrations.py RequirementsStream every requirement is in the lineage
    traces: {pages: [lineage.html]}
    status: partly
    gap: Decisions and releases are not yet linked to individual requirements in the lineage.
    added: '1.2.0-rc.1'
  - id: RQ-29
    theme: security
    statement: Partner overlays attach to the core without changing it. Core discovery stays open; overlay terms apply only in partner exchanges.
    rationale: Loading partner controls onto the civil core would make it harder to adopt and leak semantics that should stay controlled.
    communities: [defence, international]
    evidence: [E]
    priority: must
    layer: controlled
    acceptance: A controlled overlay specified, tested and governed outside this repository, using only the extension points the core publishes.
    validation: Outside this repository
    traces: {pages: [requirements.html]}
    status: controlled
# The proposed work programme. Steps are this project's proposal; nothing here is commissioned or endorsed.
programme:
  - {step: 1, label: Confirm mandate and governance, when: 'Weeks 1 to 2', output: 'Terms of reference, decision rights and an escalation route, including how controlled requirements are governed.', status: planned}
  - {step: 2, label: Agree the design principles, when: 'Weeks 2 to 3', output: 'The ten principles above, recorded as a decision.', status: done}
  - {step: 3, label: Consolidate the requirements, when: 'Weeks 3 to 4', output: 'This catalogue, version-controlled, with evidence and acceptance criteria.', status: done}
  - {step: 4, label: Run requirements workshops by community, when: 'Weeks 4 to 8', output: 'Validated requirements for the core, data asset management, controlled domains, geospatial, platforms and governance, each in its own session.', status: planned}
  - {step: 5, label: Produce the minimum viable profile, when: 'Month 3', output: 'A candidate release with scope, conformance statement, vocabularies, examples and migration guidance from the xGov MEM.', status: partly}
  - {step: 6, label: Build validation alongside, when: 'From month 1', output: 'Shapes, positive and negative test records, mapping tests and loss reports, written with the profile, not after it.', status: partly}
  - {step: 7, label: Pilot with real catalogues, when: 'Months 3 to 5', output: 'Harvesting, mapping, provenance and validation measured on a representative group of catalogues, including one controlled-domain case under appropriate controls.', status: planned}
  - {step: 8, label: Settle the repository and publication model, when: 'Before the candidate release', output: 'An organisation-owned public repository for the open core, and controlled repositories for restricted mappings and test records.', status: planned}

gates:
  - {gate: Reuse assessed for every new term, status: partly, evidence: 'Each property records whether it is reused, changed or new against the xGov MEM and DCAT; not yet a blocking check.'}
  - {gate: Every rule traced to a test, status: met, evidence: 'tests/test_profile.py fails the build if a rule has no deliberate break.'}
  - {gate: No open serious semantic-loss or disclosure defect, status: partly, evidence: 'The defect register is complete and C-22 blocks protective markings; semantic-loss defects are not yet graded by severity.'}
  - {gate: Compatibility claimed only with evidence, status: met, evidence: 'Conformance levels come from the kit; no allied or controlled compatibility is claimed (RQ-15, RQ-29).'}

controlled:
  text: >-
    Some requirements can only be specified or tested with material that is not public: allied specifications,
    control-set models and test records for protected environments. This repository holds none of it. It holds the
    open core and the extension points those layers attach to, and it lists such requirements with status
    "Controlled" so the gap stays visible. Their detail belongs in a controlled repository, governed by the right
    authorities.
  extension_points:
    - 'Namespaced modules, merged by one function, for terms a community owns'
    - 'Record-level and data-level handling, kept apart'
    - 'Explicit missing values with a reason, including withheld'
    - 'Conformance by level and by layer'
    - 'Offline validation with one verdict'

case_against:
  - {claim: 'This is a list of good intentions, not evidence.', answer: 'Every requirement says how it is evidenced and what would show it met. Engagement evidence is labelled E and not overstated: it shows a recurring need across communities, not that any one body has asked for this profile.'}
  - {claim: 'Withholding who raised what makes it impossible to check.', answer: 'True from outside. The engagement record exists for the owning team and the governance route; publishing it would aggregate information about protected communities, which the project avoids (ADR 0015).'}
  - {claim: 'A profile family will fragment into many profiles nobody can track.', answer: 'Layers share one core and one validator, and a layer exists only with its own tests. The family is smaller than the set of bespoke translations it replaces.'}
  - {claim: 'Security semantics do not belong in a civil profile at all.', answer: 'Only the minimum is in the core: handling of the record kept apart from handling of the data, and withheld values. Anything stricter is a controlled layer.'}
