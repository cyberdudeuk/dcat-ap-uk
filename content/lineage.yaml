# Lineage: where DCAT-UK AP came from, and how every item in the xGov MEM backlog was dealt with.
# Read from the GitHub API for co-cddo/ukgov-metadata-exchange-model on 6 November 2026 (V): 99 issues and pull requests,
# 22 issues and 12 pull requests open. Discussion is summarised; contributors are not named (roles, not names).

read_on: '2026-11-06'
source: https://github.com/co-cddo/ukgov-metadata-exchange-model/issues
totals: {items: 99, issues_open: 22, prs_open: 12}

# status: resolved | provisional (resolved in the profile, marked provisional pending research) | owner (needs a person outside this repository)
#         | superseded (no longer applies in the new repository) | upstream (depends on another project)
backlog:
  - n: 86
    title: Major overhaul tracking issue for the metadata exchange model and site
    labels: [enhancement, Model, infrastructure, new requirement]
    status: resolved
    resolution: >-
      This repository is the overhaul. Its six workstreams map to this repository: dependencies and infrastructure (one build
      script, no generator chain to keep patched), schema fixes (every model bug below), documentation and site (the portal), new
      requirements (spatial, temporal, schema, personal and sensitive data), governance and release management (versioning,
      change requests, the release gate) and community (issue forms and Discussions). The tracking issue in co-cddo can be closed
      with a link here once the owners agree.
    where: [page:changes, page:governance]
  - n: 78
    title: Rename the repository and references to DCAT-UK Application Profile
    labels: [documentation, enhancement, Model, MIWG, discussion]
    status: resolved
    resolution: >-
      A new repository, as the discussion suggested for a completely new solution: the model is no longer generated with LinkML
      and the site is no longer MkDocs. The old repository can be archived with a pointer here (ADR 0001). Old identifiers are
      kept in the crosswalk so existing records still map.
    where: [adr:0001, page:changes]
  - n: 76
    title: Title examples in alternative title don't follow the rules for titles
    labels: []
    status: resolved
    resolution: Examples now follow the sentence case rule they illustrate, and a check fails the build if an example title is in title case.
    where: [prop:alternative, prop:title, check:C-EX-02]
  - n: 72
    title: Distribution is incorrectly configured as an IRI or CURIE
    labels: []
    status: resolved
    resolution: A distribution can now be described in the same record or referred to by its IRI. The SHACL shape and JSON Schema both accept either.
    where: [prop:distribution]
  - n: 71
    title: The contact point definition is the same as the email definition
    labels: []
    status: resolved
    resolution: >-
      Contact point is now defined as the contact as a whole. Team name, contact form and team mailbox each have their own
      definitions. A contact form is the preferred route; a team mailbox is allowed; a named person is not.
    where: [prop:contactPoint, prop:fn, prop:hasURL, prop:hasEmail, class:ContactPoint]
  - n: 70
    title: Launch release management, lock the specification and start formal change management
    labels: [enhancement, Model, infrastructure]
    status: resolved
    resolution: >-
      Semantic versioning, a change request form, a public change log, a release gate that must pass, and released files as
      assets (JSON Schema, SHACL, JSON-LD context, codelists) rather than a source zip, as the discussion asked.
    where: [page:governance]
  - n: 69
    title: The OS postcodes example names the wrong publisher
    labels: [documentation, help wanted, Model]
    status: resolved
    resolution: The example is rebuilt from the public record and credits Ordnance Survey as publisher and creator.
    where: [example:dataset-postcodes]
  - n: 63
    title: Codelist pages don't link out to external vocabularies
    labels: [bug, wontfix, infrastructure]
    status: resolved
    resolution: The portal is generated by this repository's own script, so every concept links to its scheme and to the matching EU concept. The LinkML limitation no longer applies.
    where: [page:codelists]
  - n: 60
    title: Add usage notes to access rights
    labels: [documentation, enhancement, Model, MIWG, discussion]
    status: resolved
    resolution: Usage notes for each value, the difference from licence and security classification, and a rights statement for anything not open.
    where: [prop:accessRights, codelist:access-rights]
  - n: 49
    title: Recommend a taxonomy for theme values
    labels: [enhancement, Model, MIWG]
    status: resolved
    resolution: >-
      The 14 data.gov.uk topics are the theme list, as the issue proposed, each with a readable identifier rather than a search
      address, and mapped to the EU data themes. The cross-government taxonomy can replace it when published.
    where: [codelist:theme]
  - n: 44
    title: What to do if there is no applicable licence
    labels: [documentation, Model]
    status: resolved
    resolution: The "data sharing agreement required" value is restored, with a rights statement to describe the agreement.
    where: [prop:licence, prop:rights, codelist:licences]
  - n: 30
    title: What to do with assets that don't have a modified date
    labels: [Model, MIWG]
    status: resolved
    resolution: Last updated is recommended, not mandatory, and must never be invented. The created and release dates cover the rest.
    where: [prop:modified]
  - n: 26
    title: Indicate whether the data includes sensitive information
    labels: [enhancement, Model, MIWG]
    status: resolved
    resolution: A sensitive data property with a codelist (special category, criminal offence, children, commercially sensitive, security sensitive).
    where: [prop:sensitiveData, codelist:sensitive-data]
  - n: 25
    title: Indicate whether the data includes personal identifiable information
    labels: [enhancement, Model, MIWG]
    status: resolved
    resolution: A personal data property, mandatory for critical data assets, with values for none, personal, pseudonymised, anonymised and not yet known.
    where: [prop:personalData, codelist:personal-data]
  - n: 15
    title: Add a home page for the point of contact
    labels: [enhancement, Model]
    status: resolved
    resolution: The contact point takes a web address (vcard:hasURL), which is also the preferred route as a contact form.
    where: [prop:hasURL]
  - n: 13
    title: Decide on a persistent identifier for the metadata model
    labels: [MIWG]
    status: owner
    resolution: >-
      w3id.org is proposed (https://w3id.org/dcat-uk-ap/), and every identifier in the profile already uses it. Registering the
      redirect is a pull request to the w3id.org repository, to be made by the owning team. Until then the identifiers do not resolve,
      and the portal says so.
    owner_action: Owning team raises the w3id.org registration.
    where: [page:governance]
  - n: 11
    title: Include schemas in the documentation site
    labels: [documentation]
    status: resolved
    resolution: JSON Schema, SHACL, JSON-LD context, LinkML, SKOS codelists, CSV and examples in Turtle and JSON-LD are all downloadable, with a DCAT description of them.
    where: [page:downloads]
  - n: 5
    title: Enable declaration of the metadata's access control
    labels: [Model, MIWG, discussion, new requirement]
    status: provisional
    resolution: >-
      A "who can see this record" property with four provisional levels, separate from the access rights of the data. Marked
      provisional: the issue asked for research with catalogue owners and information assurance, which has not been done.
    where: [prop:metadataAudience, codelist:metadata-audience]
  - n: 4
    title: Capture the schema of the underlying dataset
    labels: [Model, MIWG, discussion, new requirement]
    status: resolved
    resolution: Conforms to (dct:conformsTo), as DCAT recommends and the issue proposed, with guidance by format and a link to the Tabular data standard. Mandatory for critical data assets.
    where: [prop:conformsTo]
  - n: 3
    title: Capture the reference data used and its resolution
    labels: [Model, MIWG, discussion, new requirement]
    status: provisional
    resolution: A provisional "reference data used" property that links to the classification or code list (for example age bands) and its version.
    where: [prop:referenceData]
  - n: 2
    title: Capture the temporal extent of the data resource
    labels: [Model, MIWG, discussion, new requirement]
    status: resolved
    resolution: Time period covered (dct:temporal) with start and end dates, as the discussion recommended, plus time resolution and dataset series for repeated releases such as a census.
    where: [prop:temporal, prop:temporalResolution, class:DatasetSeries]
  - n: 1
    title: Capture the geospatial coverage of the data resource
    labels: [Model, MIWG, discussion, new requirement]
    status: resolved
    resolution: >-
      Geographic coverage (dct:spatial) using, in order of preference, a GSS code or other controlled area identifier, a bounding
      box or a geometry, as the discussion concluded. The guidance names the "about the area" versus "located in the area"
      ambiguity raised in the thread, and points geospatial publishers to UK GEMINI.
    where: [prop:spatial, class:Location]

# Closed issues whose outcome the profile keeps
closed_kept:
  - {n: 73, title: 'Replace DataResource with CataloguedResource, as in DCAT 3', kept: 'DCAT 3 has no separate resource class in this profile; shared properties are listed on each class.'}
  - {n: 56, title: 'Potential changes to metadata standards to support APIs', kept: 'Data services use conformsTo for the interface standard and dct:type for the interface style, as the discussion suggested.'}
  - {n: 57, title: 'Improved guidance for the mediaType property', kept: 'Guidance carried over, with IANA addresses.'}
  - {n: 45, title: 'Usage notes for the version property', kept: 'Guidance carried over.'}
  - {n: 17, title: 'accessRights should be mandatory for datasets and data services', kept: 'Still mandatory.'}
  - {n: 6, title: 'An organisation missing from the government organisations list', kept: 'The list is now read from GOV.UK, with closed organisations kept and flagged so old records still resolve.'}

# Open pull requests in co-cddo
open_prs:
  - {n: 99, title: 'Delete the Docker image workflow', status: superseded, note: 'This repository has no Docker build.'}
  - {n: '84, 82, 90-98', title: 'Ten Dependabot updates to the Python toolchain (pytest, markdown, pygments, idna, urllib3, pymdown-extensions, requests, soupsieve, setuptools, zipp, certifi)', status: superseded, note: 'This repository does not use LinkML or MkDocs. Its own dependencies are pinned in requirements.txt.'}

