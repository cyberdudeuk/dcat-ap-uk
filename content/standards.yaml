# The standards DCAT-AP-UK connects to, and how. Provenance K unless noted: the relationships as the author understands them on
# 6 November 2026, to be checked with each community (open register O-13). Used by the standards map and the lineage explorer.
# Relation types, read as "<from> <relation> <to>".

relations:
  profiles: is a profile of
  extends: extends
  reuses: reuses terms from
  maps: has a crosswalk with
  validates: is validated with
  serialises: is published as
  supersedes: evolves and replaces
  aligns: aligns with
  governs: is governed or required by
  implements: is implemented by

groups:
  - {id: core, label: 'DCAT family', colour: 1}
  - {id: vocab, label: 'Vocabularies reused', colour: 2}
  - {id: sector, label: 'Sector profiles', colour: 3}
  - {id: national, label: 'Other national profiles', colour: 4}
  - {id: model, label: 'Other metadata models', colour: 8}
  - {id: tech, label: 'Formats and validation', colour: 5}
  - {id: policy, label: 'UK policy, law and security', colour: 6}
  - {id: tool, label: 'Products and connectors', colour: 7}

