      skills: An official Claude Code plugin, Codex and Cursor plugins, and agent skills in the skills folder (atlan-search).
      source: https://github.com/atlanhq/agent-toolkit
    crosswalk:
      - [title, name, '']
      - [description, userDescription, 'Atlan keeps a crawled description and a user description; write the curated text to userDescription.']
      - [identifier, qualifiedName, 'Atlan builds qualifiedName from the connection; keep the DCAT-AP-UK identifier in custom metadata as well.']
      - [landingPage, sourceURL, '']
      - [contactPoint, (none), 'ownerUsers and ownerGroups name people and groups. Give a team contact form in custom metadata instead.']
