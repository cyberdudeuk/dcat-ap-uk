# Vendor connectors: the data catalogue and metadata management products in the analyst reports, the platforms
# beside them, how each one's own metadata model maps to DCAT-AP-UK, the add-on kits that carry the rest, and each
# vendor's AI agent and Model Context Protocol (MCP) offer.
#
# Provenance (ADR 0020):
#   S  a vendor's own announcement or documentation. Analyst reports are paywalled, so report positions come from
#      vendor press releases and report abstracts, never from the reports themselves.
#   V  checked this session against the public repository file named, at the commit given.
#   K  background knowledge or a secondary source; to be checked.
# Nothing here is a test, an endorsement or a ranking by this project. Suppliers can correct an entry with the claim form.
# The crosswalk "rest" rule: a DCAT-AP-UK property with no native field goes in the vendor's own extension place
# (custom metadata, custom properties, an aspect), named in `bag`. The kit for each vendor defines that place.
as_of: '2026-11-07'

intro: >-
  The products that analysts rank for data catalogues, metadata management and data governance, and the platforms
  that carry catalogues inside them. For each one: where its code and metadata model are published, how its fields
  map to DCAT-AP-UK, an add-on kit for the properties it lacks, and what it offers AI agents through the Model
  Context Protocol. Live connectors need a tenant and its credentials, so the portal ships kits and conversions
  rather than calling any vendor's service.

