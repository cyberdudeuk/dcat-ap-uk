# kind: ranked (named in a report above) or platform (a catalogue inside a data or cloud platform, or open source).
vendors:
  - id: atlan
    name: Atlan
    kind: ranked
    reports: [gartner-mms-2025, gartner-dagp-2025, forrester-dg-2025, forrester-edc-2024]
    repos:
      - {repo: atlanhq/atlan-python, role: Python SDK; its typedef module defines custom metadata, commit: 3c9c37ada6c5c246a231d9a70dfe938e18da73c1, checked: '2026-11-07'}
      - {repo: atlanhq/atlan-java, role: Java SDK, commit: b44068aa921d1bfb2f92e3d823056ba75c191706, checked: '2026-11-07'}
      - {repo: atlanhq/agent-toolkit, role: MCP server, Claude Code plugin and agent skills, commit: 17b7ae3b4852a24a9271a55eb339dea0b38f1f60, checked: '2026-11-07'}
    model: {file: pyatlan/model/assets/core/asset.py, repo: atlanhq/atlan-python, prov: V}
    extend: Custom metadata, sent to the typedef API as businessMetadataDefs (pyatlan/model/typedef.py). Atlan addresses custom metadata by internal names in its API, so map the kit's names to them when loading.
    weave: atlas
    bag: {path: businessAttributes.dcat_ap_uk, style: object}
    kit: atlas-business-metadata
    ai:
      prov: V
      mcp: Hosted MCP server at mcp.atlan.com/mcp with OAuth; the local server in the repository is deprecated and in maintenance only.
      tools: [search_assets, get_assets_by_dsl, traverse_lineage, update_assets, query_asset, create_dq_rules, schedule_dq_rules, update_dq_rules, delete_dq_rules]
      skills: An official Claude Code plugin, Codex and Cursor plugins, and agent skills in the skills folder (atlan-search).
      source: https://github.com/atlanhq/agent-toolkit
    crosswalk:
      - [title, name, '']
      - [description, userDescription, 'Atlan keeps a crawled description and a user description; write the curated text to userDescription.']
      - [identifier, qualifiedName, 'Atlan builds qualifiedName from the connection; keep the DCAT-AP-UK identifier in custom metadata as well.']
      - [landingPage, sourceURL, '']
      - [contactPoint, (none), 'ownerUsers and ownerGroups name people and groups. Give a team contact form in custom metadata instead.']
    claude:
      - type: plugin
        name: Atlan
        listing: Anthropic Directory, partner publisher atlanhq
        repo: {repo: atlanhq/agent-toolkit, commit: 17b7ae3b4852a24a9271a55eb339dea0b38f1f60}
        mcp: {name: atlan, transport: http, url: 'https://mcp.atlan.com/mcp', auth: OAuth}
        skills:
          - {name: atlan-search, does: Chooses between semantic search, asset search, lineage traversal and metadata lookups, with the filter rules that make each return the right assets.}
        use: Find, explain and govern Atlan assets from Claude Code; lineage, glossary terms, certification and data quality rules.
  - id: collibra
    name: Collibra Platform
    kind: ranked
    reports: [gartner-dagp-2025, forrester-dg-2025, forrester-edc-2024]
    repos:
      - {repo: collibra/import-api-examples, role: Import API examples and input files, commit: 48e1e29c2a50cfcbdf8014bcb963720db5370b9f, checked: '2026-11-07'}
      - {repo: collibra/custom-technical-lineage-examples, role: Custom technical lineage files, commit: be066213450455d23d696c01d23444c73be6b919, checked: '2026-11-07'}
      - {repo: collibra/chip, role: Local MCP server (Go) with embedded agent skills, commit: 05d201f35d204daa3cf23a25683edf5ad5615c81, checked: '2026-11-07'}
    model: {file: input-file-examples/src/test/resources (asset JSON with attributes keyed by attribute type name), repo: collibra/import-api-examples, prov: V}
    extend: Attribute types and asset types defined in the operating model by an administrator; the Import API loads data, not the model itself.
    weave: collibra
    bag: {path: 'attributes["DCAT-AP-UK <property>"]', style: collibra}
    kit: collibra-import
    ai:
      prov: V
      mcp: A hosted MCP server on every instance at /rest/mcp with per-user OAuth, and an open-source local server (collibra/chip) using basic credentials.
      tools: [discover_data_assets, discover_business_glossary, search_asset_keyword, get_asset_details, get_lineage_upstream, get_lineage_downstream, create_asset, edit_asset, list_data_contracts, pull_data_contract_manifest, push_data_contract_manifest, create_dq_rule]
      skills: Skills embedded in the server and served through list_collibra_skills and load_collibra_skill (collibra/discovery, collibra/lineage, collibra/asset-create, collibra/asset-edit).
      source: https://productresources.collibra.com/docs/collibra/latest/Content/ModelContextProtocol/co_integrating-with-collibra-mcp.htm
    crosswalk:
      - [title, name, 'Collibra asset name; the identifier block also names the domain and community.']
      - [description, 'attributes["Description"]', 'Single values are written as [{"value": ...}], as in the repository examples.']
      - [identifier, identifier.externalEntityId, 'With identifier.externalSystemId naming the source catalogue.']
      - [keyword, tags, 'The repository has an example that adds assets with tags.']
      - [contactPoint, (none), 'Responsibilities name people. Give a team contact form as an attribute.']
    claude:
