# Records that must fail. Each names the rule the browser validator must report, and whether SHACL and JSON Schema must also reject it.
# Every one is a deliberate break (vaccination, VER-05): if any of the three validators accepts one, the test suite fails.
# Test fixtures only: never published. Email values use reserved example domains (RFC 2606).
- key: missing-title
  rule: M-01
  record: {class: Dataset, id: 'https://example.org/x', description: d, identifier: x, publisher: 'https://example.org/o', contactPoint: [{fn: Team, hasURL: 'https://example.org/c'}], accessRights: 'ukcl:access-rights/open', securityClassification: 'ukcl:security-classification/official', licence: 'http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/', accrualPeriodicity: 'eufreq:MONTHLY'}
- key: bad-access-rights
  rule: V-01
  record: {class: Dataset, id: 'https://example.org/x', title: t, description: d, identifier: x, publisher: 'https://example.org/o', contactPoint: [{fn: Team, hasURL: 'https://example.org/c'}], accessRights: 'ukcl:access-rights/public', securityClassification: 'ukcl:security-classification/official', licence: 'http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/', accrualPeriodicity: 'eufreq:MONTHLY'}
- key: withdrawn-not-applicable
  rule: V-01
  issue: MEM NOT_APPLICABLE withdrawn
  record: {class: Dataset, id: 'https://example.org/x', title: t, description: d, identifier: x, publisher: 'https://example.org/o', contactPoint: [{fn: Team, hasURL: 'https://example.org/c'}], accessRights: 'ukcl:access-rights/open', securityClassification: 'ukcl:security-classification/not-applicable', licence: 'http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/', accrualPeriodicity: 'eufreq:MONTHLY'}
